<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Password Generator</h1>
            <p class="subtitle" data-i18n="subtitle">Generate strong, secure passwords locally in your browser</p>
        </header>

        <div class="result-section">
            <input type="text" id="passwordResult" readonly placeholder="Click Generate" data-i18n="placeholder">
            <button id="copyBtn" class="copy-button" data-i18n="copy_btn">Copy</button>
        </div>

        <div class="options-section">
            <div class="length-group">
                <label for="pwdLength"><span data-i18n="length_label">Password Length: </span><span id="lengthVal">16</span></label>
                <input type="range" id="pwdLength" min="8" max="128" value="16">
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="includeUpper" checked>
                    <span data-i18n="uppercase_label">Include Uppercase Letters</span>
                </label>
                <label>
                    <input type="checkbox" id="includeLower" checked>
                    <span data-i18n="lowercase_label">Include Lowercase Letters</span>
                </label>
                <label>
                    <input type="checkbox" id="includeNumbers" checked>
                    <span data-i18n="numbers_label">Include Numbers</span>
                </label>
                <label>
                    <input type="checkbox" id="includeSymbols" checked>
                    <span data-i18n="symbols_label">Include Symbols</span>
                </label>
            </div>
        </div>

        <div class="controls">
            <button id="generateBtn" class="primary-btn" data-i18n="generate_btn">Generate Password</button>
        </div>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
