<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text to Speech Generator</title>
    <link rel="stylesheet" href="style.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Text to Speech Generator"></head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Text to Speech Generator</h1>
            <p class="subtitle" data-i18n="subtitle">Convert text to natural sounding speech instantly in your browser</p>
        </header>

        <div class="workspace">
            <div class="controls-section">
                <div class="control-group">
                    <label for="voiceSelect" data-i18n="voice_label">Voice</label>
                    <select id="voiceSelect"></select>
                </div>

                <div class="sliders">
                    <div class="control-group">
                        <label for="rateSlider"><span data-i18n="speed_label">Speed (</span><span id="rateVal">1</span>)</label>
                        <input type="range" id="rateSlider" min="0.5" max="2" value="1" step="0.1">
                    </div>
                    
                    <div class="control-group">
                        <label for="pitchSlider"><span data-i18n="pitch_label">Pitch (</span><span id="pitchVal">1</span>)</label>
                        <input type="range" id="pitchSlider" min="0" max="2" value="1" step="0.1">
                    </div>
                </div>
            </div>

            <div class="input-section">
                <textarea id="textInput" placeholder="Type or paste the text you want me to read..." data-i18n="placeholder"></textarea>
            </div>
            
            <div class="action-section">
                <button id="playBtn" class="primary-btn" data-i18n="play_btn">Play</button>
                <button id="stopBtn" class="danger-btn" data-i18n="stop_btn">Stop</button>
            </div>
        </div>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="script.js"></script>


</body></html>
