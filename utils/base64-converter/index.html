<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder & Decoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Base64 Converter</h1>
            <p class="subtitle" data-i18n="subtitle">Instantly encode and decode Base64 strings locally</p>
        </header>

        <div class="mode-toggle">
            <button id="modeEncodeBtn" class="toggle-btn active" data-i18n="encode_mode_btn">Encode to Base64</button>
            <button id="modeDecodeBtn" class="toggle-btn" data-i18n="decode_mode_btn">Decode from Base64</button>
        </div>

        <div class="workspace">
            <div class="input-section">
                <label id="inputLabel" for="inputText" data-i18n="input_label_plain">Plain Text</label>
                <textarea id="inputText" placeholder="Type or paste here..." data-i18n="textarea_placeholder"></textarea>
                <div id="errorMsg" class="error-msg hidden"></div>
            </div>
            
            <div class="controls">
                <button id="convertBtn" class="primary-btn" data-i18n="convert_btn_encode">Encode</button>
                <button id="clearBtn" class="danger-btn" data-i18n="clear_btn">Clear</button>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <label id="outputLabel" for="outputText" data-i18n="output_label_base64">Base64 Output</label>
                    <button id="copyBtn" class="secondary-btn" data-i18n="copy_btn">Copy Output</button>
                </div>
                <textarea id="outputText" readonly placeholder="Result will appear here..." data-i18n="output_placeholder"></textarea>
            </div>
        </div>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
