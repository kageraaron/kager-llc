<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Watermark Remover - Clean Your Images Instantly</title>
    <meta name="description" content="Free client-side tool to remove watermarks from your images instantly. Fast, private, and easy to use.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-background"></div>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Watermark Remover</h1>
            <p class="subtitle" data-i18n="subtitle">Effortlessly clean your images right in your browser</p>
        </header>
        
        <main>
            <div class="upload-section" id="dropZone">
                <input type="file" id="imageUpload" accept="image/*">
                <label for="imageUpload" class="upload-label">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="upload-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                    <span data-i18n="upload_hint">Click to upload or drag & drop</span>
                    <span class="file-hint" data-i18n="file_type_hint">Supports JPG, PNG, WEBP</span>
                </label>
            </div>

            <div class="workspace hidden" id="workspace">
                <div class="canvas-wrapper">
                    <canvas id="imageCanvas"></canvas>
                    <div id="selectionBox" class="selection-box hidden"></div>
                </div>
                <p class="instruction-text" id="instructionText" data-i18n="instruction">Draw a box around the watermark to remove it</p>
                
                <div class="controls">
                    <button id="removeWatermarkBtn" class="btn primary" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L2.36 18.64a1.21 1.21 0 0 0 0 1.72l1.28 1.28a1.2 1.2 0 0 0 1.72 0L21.64 5.36a1.2 1.2 0 0 0 0-1.72Z"></path><path d="m14 7 3 3"></path><path d="M5 6v4"></path><path d="M19 14v4"></path><path d="M10 2v2"></path><path d="M7 8H3"></path><path d="M21 16h-4"></path><path d="M11 3H9"></path></svg>
                        <span data-i18n="remove_btn">Remove Watermark</span>
                    </button>
                    <button id="resetBtn" class="btn secondary" data-i18n="reset_btn">Reset</button>
                    <button id="downloadBtn" class="btn success hidden">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        <span data-i18n="download_btn">Download</span>
                    </button>
                </div>
            </div>
        </main>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space - Supports free tools</p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
