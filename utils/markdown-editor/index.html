<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Editor & Previewer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Markdown Editor</h1>
            <p class="subtitle" data-i18n="subtitle">Write Markdown on the left, see the preview on the right instantly.</p>
        </header>

        <div class="workspace">
            <div class="editor-pane">
                <div class="pane-header">
                    <span data-i18n="input_label">Markdown Input</span>
                    <button id="clearBtn" class="danger-btn" data-i18n="clear_btn">Clear</button>
                </div>
                <textarea id="markdownInput" placeholder="# Hello World\n\nWrite your markdown here..." data-i18n="placeholder"></textarea>
            </div>
            
            <div class="preview-pane">
                <div class="pane-header">
                    <span data-i18n="preview_label">Live Preview</span>
                </div>
                <div id="previewOutput" class="markdown-body"></div>
            </div>
        </div>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    
    <script src="i18n.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
