<!DOCTYPE html><html lang="en"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Assembler</title>
    <link rel="stylesheet" href="style.css">

    <meta property="og:type" content="website">
    <meta property="og:title" content="PDF Assembler"></head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">PDF Assembler</h1>
            <p class="subtitle" data-i18n="subtitle">Merge multiple PDF files into one document</p>
        </header>

        <div class="upload-section">
            <input type="file" id="pdfUpload" multiple="" accept=".pdf" hidden="">
            <label for="pdfUpload" class="upload-button" data-i18n="upload_label">Select PDF Files</label>
            <p data-i18n="drag_drop_text">Or drag and drop PDF files here</p>
        </div>

        <div class="file-list-container">
            <h2 data-i18n="file_list_title">Files to Merge:</h2>
            <ul id="pdfFileList">
                <!-- PDF files will be listed here -->
            </ul>
        </div>

        <div class="controls">
            <button id="mergePdfBtn" disabled="" data-i18n="merge_btn">Merge PDFs</button>
            <button id="downloadPdfBtn" hidden="" data-i18n="download_btn">Download Merged PDF</button>
        </div>

        <div class="ad-banner">
            <!-- Ad Placeholder -->
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>

    <!-- Script for PDF merging -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="script.js"></script>


</body></html>
