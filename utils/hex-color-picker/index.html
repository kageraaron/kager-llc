<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX Code Color Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Color Picker</h1>
            <p class="subtitle" data-i18n="subtitle">Pick colors from an image and get HEX, RGB, HSL values</p>
        </header>

        <div class="upload-section">
            <input type="file" id="imageUpload" accept="image/*" hidden>
            <label for="imageUpload" class="upload-button" data-i18n="upload_label">Upload Image</label>
            <p data-i18n="drag_drop_text">Or drag and drop an image file here</p>
        </div>

        <div id="imagePreviewContainer" class="image-preview-section" hidden>
            <h2 data-i18n="preview_title">Image Preview:</h2>
            <div class="image-viewer">
                <canvas id="imageCanvas"></canvas>
                <div id="colorPickerOverlay"></div>
            </div>
        </div>

        <div id="colorInfoSection" class="color-info-section" hidden>
            <h2 data-i18n="picked_title">Picked Color:</h2>
            <div class="color-display" id="pickedColorDisplay"></div>
            <div class="color-values">
                <div class="value-item">
                    <span class="label" data-i18n="hex_label">HEX:</span>
                    <span id="hexValue" class="copyable">#000000</span>
                </div>
                <div class="value-item">
                    <span class="label" data-i18n="rgb_label">RGB:</span>
                    <span id="rgbValue" class="copyable">rgb(0, 0, 0)</span>
                </div>
                <div class="value-item">
                    <span class="label" data-i18n="hsl_label">HSL:</span>
                    <span id="hslValue" class="copyable">hsl(0, 0%, 0%)</span>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="resetBtn" data-i18n="reset_btn">Reset</button>
        </div>

        <div class="ad-banner">
            <!-- Ad Placeholder -->
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>

    <script src="script.js"></script>
</body>
</html>
