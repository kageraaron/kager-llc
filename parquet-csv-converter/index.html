<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parquet to CSV Converter | Private & Local</title>
    <meta name="description" content="Convert Parquet to CSV and CSV to Parquet locally in your browser. Fast, secure, and privacy-focused.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Parquet <span class="accent">↔</span> CSV Converter</h1>
            <p class="subtitle">Secure, client-side conversion. Your data never leaves your computer.</p>
        </header>

        <div class="mode-toggle">
            <button id="modeParquetToCsvBtn" class="toggle-btn active">Parquet to CSV</button>
            <button id="modeCsvToParquetBtn" class="toggle-btn">CSV to Parquet</button>
        </div>

        <div class="workspace">
            <div id="dropZone" class="drop-zone">
                <div class="drop-zone-content">
                    <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                    </svg>
                    <p id="dropZoneText">Drag & drop your <span id="fileTypeLabel">.parquet</span> file or click to browse</p>
                    <input type="file" id="fileInput" hidden>
                </div>
            </div>

            <div id="fileInfo" class="file-info hidden">
                <div class="file-details">
                    <span id="fileName">filename.parquet</span>
                    <span id="fileSize">0 KB</span>
                </div>
                <button id="removeFileBtn" class="text-btn">Remove</button>
            </div>

            <div id="statusMsg" class="status-msg hidden"></div>

            <div class="controls">
                <button id="convertBtn" class="primary-btn" disabled>Convert Now</button>
            </div>

            <div id="previewSection" class="preview-section hidden">
                <h3>Data Preview (First 5 Rows)</h3>
                <div class="table-container">
                    <table id="previewTable">
                        <!-- Preview data will be injected here -->
                    </table>
                </div>
            </div>
            
            <div id="resultSection" class="result-section hidden">
                <div class="success-banner">
                    <p>Conversion Complete!</p>
                </div>
                <button id="downloadBtn" class="secondary-btn">Download Result</button>
            </div>
        </div>

        <div class="ad-banner">
            <p>Ad Space</p>
        </div>

        <footer class="footer">
            <p>&copy; 2026 Kager LLC. All processing is 100% client-side.</p>
        </footer>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <!-- We will load duckdb-wasm or parquet-wasm in script.js -->
    <script src="script.js"></script>
</body>
</html>
