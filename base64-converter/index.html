<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder & Decoder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Base64 Converter</h1>
            <p class="subtitle">Instantly encode and decode Base64 strings locally</p>
        </header>

        <div class="mode-toggle">
            <button id="modeEncodeBtn" class="toggle-btn active">Encode to Base64</button>
            <button id="modeDecodeBtn" class="toggle-btn">Decode from Base64</button>
        </div>

        <div class="workspace">
            <div class="input-section">
                <label id="inputLabel" for="inputText">Plain Text</label>
                <textarea id="inputText" placeholder="Type or paste here..."></textarea>
                <div id="errorMsg" class="error-msg hidden"></div>
            </div>
            
            <div class="controls">
                <button id="convertBtn" class="primary-btn">Encode</button>
                <button id="clearBtn" class="danger-btn">Clear</button>
            </div>

            <div class="output-section">
                <div class="output-header">
                    <label id="outputLabel" for="outputText">Base64 Output</label>
                    <button id="copyBtn" class="secondary-btn">Copy Output</button>
                </div>
                <textarea id="outputText" readonly placeholder="Result will appear here..."></textarea>
            </div>
        </div>

        <div class="ad-banner">
            <p>Ad Space</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
