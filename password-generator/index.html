<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <p class="subtitle">Generate strong, secure passwords locally in your browser</p>

        <div class="result-section">
            <input type="text" id="passwordResult" readonly placeholder="Click Generate">
            <button id="copyBtn" class="copy-button">Copy</button>
        </div>

        <div class="options-section">
            <div class="length-group">
                <label for="pwdLength">Password Length: <span id="lengthVal">16</span></label>
                <input type="range" id="pwdLength" min="8" max="128" value="16">
            </div>

            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="includeUpper" checked>
                    Include Uppercase Letters
                </label>
                <label>
                    <input type="checkbox" id="includeLower" checked>
                    Include Lowercase Letters
                </label>
                <label>
                    <input type="checkbox" id="includeNumbers" checked>
                    Include Numbers
                </label>
                <label>
                    <input type="checkbox" id="includeSymbols" checked>
                    Include Symbols
                </label>
            </div>
        </div>

        <div class="controls">
            <button id="generateBtn" class="primary-btn">Generate Password</button>
        </div>

        <div class="ad-banner">
            <p>Ad Space</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
