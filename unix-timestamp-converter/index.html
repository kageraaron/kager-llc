<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix Timestamp Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="language-switcher">
                <button class="lang-btn" onclick="i18n.setLanguage('en')" data-lang="en">EN</button>
                <button class="lang-btn" onclick="i18n.setLanguage('es')" data-lang="es">ES</button>
                <button class="lang-btn" onclick="i18n.setLanguage('fr')" data-lang="fr">FR</button>
                <button class="lang-btn" onclick="i18n.setLanguage('de')" data-lang="de">DE</button>
                <button class="lang-btn" onclick="i18n.setLanguage('zh')" data-lang="zh">ZH</button>
                <button class="lang-btn" onclick="i18n.setLanguage('ja')" data-lang="ja">JA</button>
            </div>
            <h1 data-i18n="h1">Unix Epoch Converter</h1>
            <p class="subtitle" data-i18n="subtitle">Instantly convert Unix timestamps to human-readable dates</p>
        </header>

        <div class="live-clock">
            <h2 data-i18n="current_timestamp_label">Current Unix Timestamp</h2>
            <div class="epoch-display" id="currentEpoch" data-i18n="loading">Loading...</div>
            <p class="clock-subtitle" id="currentDateStr"></p>
        </div>

        <div class="workspace">
            <div class="conversion-section">
                <h3 data-i18n="epoch_to_date_h3">Epoch to Date</h3>
                <div class="input-group">
                    <input type="number" id="epochInput" placeholder="e.g. 1714521600" data-i18n="epoch_placeholder">
                    <button id="convertEpochBtn" class="primary-btn" data-i18n="convert_btn">Convert</button>
                </div>
                
                <div class="results-grid">
                    <div class="result-box">
                        <label data-i18n="local_time_label">Local Time</label>
                        <input type="text" id="localResult" readonly>
                    </div>
                    <div class="result-box">
                        <label data-i18n="utc_time_label">UTC Time</label>
                        <input type="text" id="utcResult" readonly>
                    </div>
                    <div class="result-box">
                        <label data-i18n="iso_label">ISO 8601</label>
                        <input type="text" id="isoResult" readonly>
                    </div>
                </div>
                <div id="epochErrorMsg" class="error-msg hidden" data-i18n="invalid_timestamp">Invalid Timestamp</div>
            </div>

            <hr>

            <div class="conversion-section">
                <h3 data-i18n="date_to_epoch_h3">Date to Epoch</h3>
                <div class="input-group">
                    <input type="datetime-local" id="dateInput">
                    <button id="convertDateBtn" class="primary-btn" data-i18n="convert_btn">Convert</button>
                </div>
                <div class="results-grid">
                    <div class="result-box">
                        <label data-i18n="unix_timestamp_seconds_label">Unix Timestamp (Seconds)</label>
                        <input type="text" id="epochResult" readonly>
                    </div>
                    <div class="result-box">
                        <label data-i18n="milliseconds_label">Milliseconds</label>
                        <input type="text" id="msResult" readonly>
                    </div>
                </div>
            </div>
        </div>

        <div class="ad-banner">
            <p data-i18n="ad_space">Ad Space</p>
        </div>
    </div>
    <script src="i18n.js"></script>
    <script src="script.js"></script>
</body>
</html>
