<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>QR Code Generator</h1>
        <div class="input-section">
            <textarea id="qrData" placeholder="Enter text, URL, or vCard data here..."></textarea>
            <div class="options">
                <label for="qrColor">Color:</label>
                <input type="color" id="qrColor" value="#000000">
                <label for="qrErrorCorrection">Error Correction:</label>
                <select id="qrErrorCorrection">
                    <option value="L">Low (7%)</option>
                    <option value="M" selected>Medium (15%)</option>
                    <option value="Q">Quartile (25%)</option>
                    <option value="H">High (30%)</option>
                </select>
            </div>
            <button id="generateQrBtn">Generate QR Code</button>
        </div>
        <div class="qr-display">
            <div id="qrcode"></div>
            <p id="qrMessage">Enter data and click Generate.</p>
        </div>
        <div class="download-section">
            <a id="downloadQrBtn" href="#" download="qrcode.png" hidden>Download QR Code</a>
        </div>
        <div class="ad-banner">
            <!-- Ad Placeholder -->
            <p>Ad Space</p>
        </div>
    </div>
    <!-- Include a QR code generation library, e.g., qrcode-generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/2.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
