name: Daily Blog Generation

on:
  schedule:
    - cron: '47 6 * * *'   # 6:47am UTC daily
  workflow_dispatch:         # allow manual trigger from GitHub UI

jobs:
  generate-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Claude CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Create branch
        id: branch
        run: |
          DATE=$(date +%Y-%m-%d)
          BRANCH="blog/auto-$DATE"
          git checkout -b "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Generate 5 blog posts
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          claude --dangerously-skip-permissions -p "
          You are the daily blog generation agent for ravewellness.org.
          Working directory is the current directory (harm-reduction repo root).

          ## Your task: generate 5 new blog posts

          ### Step 1 — Pick 5 topics
          1. Read \`blog-ideas.md\` — find all lines marked \`[ ]\` (not started)
          2. List all existing files in \`src/content/blog/\` — skip topics whose slug would conflict
          3. Select 5 topics spanning different categories (not all MDMA — aim for variety)
          4. Prioritize items in the High-Priority section

          ### Step 2 — Write each post
          For each topic, follow the complete workflow in \`.claude/commands/blog.md\` exactly.
          Use the evidence standards from the harm-research skill (documented in \`.claude/commands/blog.md\` under Step 1).

          Write each finished post to \`src/content/blog/<slug>.md\` using the Write tool.

          Affiliate links to include where relevant (only when genuinely useful):
          - DanceSafe test kits: https://dancesafe.org/product/complete-set-of-all-9-testing-kits/r/ravewellness/
          - DanceSafe store: https://dancesafe.org/r/ravewellness/
          - Amazon tag: ravewellness01-20

          Internal pages to link to where relevant:
          /mdma.html, /ketamine.html, /lsd.html, /psilocybin.html, /cocaine.html,
          /ghb.html, /poppers.html, /2cb.html, /nitrous.html, /interactions.html,
          /test-kits.html, /hearing.html, /faq.html

          ### Step 3 — Update ideas file
          In \`blog-ideas.md\`, change each written topic from \`[ ]\` to \`[x]\`.

          ### Step 4 — Verify build
          Run: npm run build
          If it fails, read the error and fix the offending file before finishing.

          Write the titles of the 5 posts you wrote to a file called \`.blog-run-summary\` (one title per line). This will be used to generate the PR description.
          "

      - name: Verify build
        run: npm run build

      - name: Commit new posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/
          git add blog-ideas.md
          git diff --staged --quiet || git commit -m "blog: auto-generate 5 posts ${{ steps.branch.outputs.date }}"

      - name: Push branch
        run: git push origin ${{ steps.branch.outputs.branch }}

      - name: Read post titles
        id: summary
        run: |
          if [ -f .blog-run-summary ]; then
            TITLES=$(cat .blog-run-summary | sed 's/^/- /' | tr '\n' '\n')
            rm .blog-run-summary
          else
            TITLES="- (titles unavailable)"
          fi
          echo "titles<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TITLES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --title "Blog: 5 new posts (${{ steps.branch.outputs.date }})" \
            --body "## Auto-generated posts

          ${{ steps.summary.outputs.titles }}

          ## Review checklist
          - [ ] Citations and PMIDs verified
          - [ ] Internal links resolve correctly
          - [ ] Affiliate links are appropriate and not forced
          - [ ] No factual errors or overclaiming
          - [ ] Tone matches existing content (direct, non-judgmental, evidence-based)

          ---
          🤖 Generated by daily blog workflow · [Ideas backlog](../blob/main/blog-ideas.md)" \
            --base main \
            --head ${{ steps.branch.outputs.branch }}
