name: Stub scheduled jobs

# Vercel's Hobby plan caps cron jobs at ONE RUN PER DAY, which is useless for
# inbox scanning. This repo is public, so GitHub Actions minutes are free and
# unlimited — we schedule here and just call the deployed endpoints.
#
# vercel.json keeps a daily run of each as a safety net, so the app still works
# if this workflow is ever disabled. Both jobs are idempotent (ingest dedupes on
# a content hash, reminders dedupe via sent_reminders), so overlap is harmless.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   STUB_BASE_URL  e.g. https://stub.vercel.app   (no trailing slash)
#   CRON_SECRET    must match the value in Vercel's environment variables

# NOTE on the `if:` blocks below: every continuation line must sit at the SAME
# indentation. A folded scalar (`>-`) keeps a MORE-indented line literal instead
# of folding it, which injects a real newline into the middle of the expression.
on:
  schedule:
    # Gmail scan every 30 minutes. GitHub may delay scheduled runs under load;
    # that is fine here, nothing depends on exact timing.
    - cron: '*/30 * * * *'
    # Day-before reminders, hourly on the hour.
    - cron: '0 * * * *'
    # New-show announcements for followed artists, once a day. Not more: this
    # is a push to a phone, and the news keeps.
    - cron: '0 16 * * *'
    # Catalog enrichment, daily. Every pass is bounded, idempotent and fills
    # nulls rather than overwriting, so it is safe unattended — and without a
    # schedule the artist photos and MusicBrainz identities never fill in at all.
    - cron: '40 7 * * *'
    # Database keep-alive, daily. Supabase pauses a free project after ~7 days
    # idle; this writes one row so that clock never gets close to running out.
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job to run'
        required: true
        default: 'both'
        type: choice
        options: [both, gmail-sync, reminders, announce, keepalive, repair]

concurrency:
  group: stub-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Check configuration
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$BASE" ] || [ -z "$SECRET" ]; then
            echo "::error::STUB_BASE_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi

      - name: Gmail sync
        # The 30-minute schedule fires this; manual runs honour the input.
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '*/30 * * * *' ||
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'both' || inputs.job == 'gmail-sync')
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$BASE/api/cron/gmail-sync")
          echo "HTTP $code"
          # Never print the body unredacted — it contains connected email addresses.
          #
          # This MUST stay a one-liner. It was a multi-line `python3 -c "..."`
          # heredoc written at column 0, which dedents out of this `run: |` block
          # scalar and makes the whole file unparseable — "can not read a block
          # mapping entry" at the first `try:`. GitHub then reported the workflow
          # by its PATH instead of its name, never registered `schedule` or
          # `workflow_dispatch`, and logged a 0s "invalid workflow file" run on
          # every push. Nothing had ever run.
          jq -c '{ok, accounts, summary: [.summary[]? | del(.email)]}' /tmp/out.json \
            || echo 'non-JSON response'
          [ "$code" = "200" ] || { echo "::error::gmail-sync returned $code"; exit 1; }

      - name: Send reminders
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '0 * * * *' ||
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'both' || inputs.job == 'reminders')
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/rem.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$BASE/api/cron/reminders")
          echo "HTTP $code"
          cat /tmp/rem.json
          echo
          [ "$code" = "200" ] || { echo "::error::reminders returned $code"; exit 1; }

      - name: Keep database awake
        # Daily schedule fires this; manual runs honour the input. Also runs on
        # every manual "both", since it is a single cheap request.
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '17 6 * * *' ||
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'both' || inputs.job == 'keepalive')
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/beat.json -w '%{http_code}' --max-time 60 \
            -H "Authorization: Bearer $SECRET" "$BASE/api/cron/keepalive")
          echo "HTTP $code"
          cat /tmp/beat.json
          echo
          # This one failing means the project is drifting toward a pause, which
          # is exactly the thing you want to hear about before it happens.
          [ "$code" = "200" ] || { echo "::error::keepalive returned $code"; exit 1; }

      - name: Repair and enrich catalog rows
        # Daily, and manually on request.
        #
        # This was manual-only on the reasoning that it "rewrites existing
        # rows". That was too cautious and had a real cost: artist photos and
        # MusicBrainz identities are filled in HERE, so leaving it unscheduled
        # meant they were never filled in at all — every club act kept its
        # initials placeholder indefinitely.
        #
        # Every pass is bounded per run, idempotent, and fills nulls rather than
        # overwriting. The one pass that does rewrite (localized event titles)
        # only touches strings that are demonstrably a lineup join.
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '40 7 * * *' ||
          github.event_name == 'workflow_dispatch' && inputs.job == 'repair'
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/repair.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$BASE/api/cron/repair")
          echo "HTTP $code"
          cat /tmp/repair.json
          echo
          [ "$code" = "200" ] || { echo "::error::repair returned $code"; exit 1; }

      - name: Announce new shows
        if: >-
          github.event_name == 'schedule' && github.event.schedule == '0 16 * * *' ||
          github.event_name == 'workflow_dispatch' &&
          (inputs.job == 'both' || inputs.job == 'announce')
        env:
          BASE: ${{ secrets.STUB_BASE_URL }}
          SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/ann.json -w '%{http_code}' --max-time 120 \
            -H "Authorization: Bearer $SECRET" "$BASE/api/cron/announce")
          echo "HTTP $code"
          cat /tmp/ann.json
          echo
          [ "$code" = "200" ] || { echo "::error::announce returned $code"; exit 1; }
